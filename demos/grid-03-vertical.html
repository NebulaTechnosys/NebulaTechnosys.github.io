<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 3 — All vertical</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0a0e17; color: #e8ecf4; }
    .top { padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(148,163,184,0.12); }
    .top a { color: #06b6d4; text-decoration: none; font-size: 0.9rem; }
    .top h1 { font-size: 1.15rem; margin: 0.5rem 0 0.25rem; }
    .top p { font-size: 0.85rem; color: #94a3b8; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      align-items: start;
    }
    .cell {
      height: 280px;
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid rgba(148,163,184,0.1);
    }
    .cell img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
    @media (max-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); } .cell { height: 220px; } }
    @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html">← All demos</a>
    <h1>Demo 3 — All vertical</h1>
    <p>Tall portrait columns only — narrow vertical rectangles in a row.</p>
  </header>
  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const imgs = [
      '../images/prints/IMG_20190109_225144.jpg',
      '../images/prints/IMG_20190109_225201.jpg',
      '../images/prints/IMG_20190403_132746.jpg',
      '../images/prints/IMG_20191020_065532.jpg',
      '../images/prints/IMG_20190109_225144.jpg',
      '../images/prints/IMG_20190109_225201.jpg',
      '../images/prints/IMG_20190403_132746.jpg',
      '../images/prints/IMG_20191020_065532.jpg',
      '../images/prints/IMG_20190109_225144.jpg',
      '../images/prints/IMG_20190109_225201.jpg'
    ];
    document.getElementById('grid').innerHTML = imgs.map((s,i) =>
      `<div class="cell"><img src="${s}" alt="Tall ${i+1}" loading="lazy"></div>`
    ).join('');
  </script>
</body>
</html>
